name: Build StromLagrer APK

on:
  push:
    branches:
      - chatgpt-stromlagrer-build

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Reconstruct project
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p work/project
          cat strom-build/chunk00a.txt strom-build/chunk00b.txt strom-build/chunk00c.txt strom-build/chunk00d.txt strom-build/chunk00e.txt strom-build/chunk01.txt strom-build/chunk02.txt strom-build/chunk03.txt | base64 -d > work/src.tgz
          tar -xzf work/src.tgz -C work/project
          cp strom-build/BrowserActivity.java work/project/app/src/main/java/no/haavald/streamsaver/BrowserActivity.java
          python3 strom-build/patch_v105.py work/project
          grep -R "Slett historikk" -n work/project/app/src/main/java
          grep -R "By Duppe · v1.0.5" -n work/project/app/src/main/java
          grep -R "Åpne nettside og velg strøm" -n work/project/app/src/main/java

      - name: Ensure Android SDK 36
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" || true

      - name: Build debug APK
        working-directory: work/project
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        shell: bash
        run: cp work/project/app/build/outputs/apk/debug/app-debug.apk work/StromLagrer-1.0.5.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StromLagrer-1.0.5-apk
          path: work/StromLagrer-1.0.5.apk
          if-no-files-found: error
